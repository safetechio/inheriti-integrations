<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InheritiGuard · SafeKey PRO</title>
    <link rel="stylesheet" href="../side-panel/styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <div class="modal-panel safekey-dialog" id="safekey-dialog">
        <img
          class="safekey-business-logo"
          src="../side-panel/assets/inheriti-business-logo.png"
          alt="Inheriti® Business"
        />
        <p class="eyebrow">Local approval · Plan Access</p>
        <h1 id="safekey-title">Connecting to SafeKey PRO</h1>
        <p id="safekey-intro" class="safekey-intro">
          Keep your device connected.
        </p>
        <p
          id="safekey-status"
          class="access-status"
          role="status"
          aria-live="polite"
        ></p>
        <div id="safekey-choice" class="safekey-choices" hidden>
          <button class="safekey-option" id="safekey-pro" type="button">
            <img src="../side-panel/assets/safekey-pro.png" alt="" /><span
              ><strong></strong><small></small
            ></span>
          </button>
          <button class="safekey-option" id="safekey-mobile" type="button">
            <img src="../side-panel/assets/safekey-mobile.png" alt="" /><span
              ><strong></strong><small></small></span
            >
          </button>
        </div>
        <form id="safekey-pin-form" hidden>
          <div class="safekey-device">
            <img
              src="../side-panel/assets/safekey-pro.png"
              alt="SafeKey PRO device"
            /><span>Keep your device connected during this request.</span>
          </div>
          <label class="safekey-pin-label" for="safekey-pin"
            >SafeKey PRO PIN</label
          >
          <input
            id="safekey-pin"
            type="password"
            autocomplete="off"
            maxlength="128"
            required
          />
          <button class="button primary" type="submit">
            Connect and continue
          </button>
        </form>
        <div id="safekey-touch" class="safekey-device" hidden>
          <img
            src="../side-panel/assets/safekey-pro.png"
            alt="SafeKey PRO device"
          /><span></span>
        </div>
        <button class="button ghost" id="safekey-cancel" type="button">
          Cancel
        </button>
        <p id="guard-version" class="popup-version"></p>
      </div>
    </main>
  </body>
</html>
