<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Inheriti® Workspace</title>
  </head>
  <body>
    <header id="window-chrome" class="app-header" hidden>
      <span class="window-title">Inheriti® Workspace</span>
      <button id="start-over" class="window-close-preview" type="button" hidden>Start over</button>
      <div class="window-controls">
        <button id="window-minimize" type="button" aria-label="Minimize window" title="Minimize"></button>
        <button id="window-maximize" type="button" aria-label="Maximize or restore window" title="Maximize or restore"></button>
        <button id="window-close" type="button" aria-label="Close window" title="Close"></button>
      </div>
    </header>
    <p id="close-status" class="close-status" role="alert" hidden>
      Workspace could not close securely. Please try closing it again.
    </p>
    <main>
      <section class="workspace-card" aria-labelledby="workspace-title">
        <img
          class="hero-mark"
          src="assets/inheriti-brandmark-full-color.svg"
          alt=""
        />
        <h1 id="workspace-title">Open Inheriti® files <em>securely</em>.</h1>
        <p class="intro">
          Your file stays on this computer. Workspace checks your access and opens
          it securely.
        </p>

        <div id="file-step" class="wizard-step file-area">
          <p class="file-title">Drop a <code>.inheriti</code> file here</p>
          <p>Or select a file to open it securely.</p>
          <button id="choose-file" class="button button-primary" type="button">Choose file</button>
          <p id="file-error" class="file-error" role="alert" hidden></p>
          <button id="reset-file" class="button button-quiet" type="button" hidden>Cancel</button>
        </div>
        <span id="app-version" class="version-label" aria-label="Workspace version"></span>

        <div id="opening-step" class="wizard-step" hidden>
          <p id="opening-status" class="account-status" role="status" aria-live="polite"></p>
          <div id="opening-progress" class="activity-track" role="progressbar" aria-label="Opening request in progress"><span></span></div>
          <p id="adapter-status" class="adapter-status" role="status" aria-live="polite" hidden></p>
          <button id="cancel-opening" class="button button-quiet" type="button">Cancel</button>
        </div>

        <div id="preview-area" class="wizard-step preview-area" hidden>
          <div id="pdf-controls" class="pdf-controls" hidden>
            <button id="pdf-previous" class="button button-quiet" type="button">Previous</button>
            <span id="pdf-page-label" aria-live="polite"></span>
            <button id="pdf-next" class="button button-quiet" type="button">Next</button>
            <button id="pdf-fit" class="button button-quiet" type="button">Fit width</button>
            <button id="pdf-zoom-in" class="button button-quiet" type="button">Zoom in</button>
            <button id="pdf-zoom-out" class="button button-quiet" type="button">Zoom out</button>
          </div>
          <p id="pdf-status" class="account-status" role="status" aria-live="polite" hidden></p>
          <pre id="result" aria-live="polite"></pre>
          <div id="image-scroll" hidden>
            <canvas id="image-preview" hidden aria-label="Protected image preview"></canvas>
          </div>
        </div>
      </section>
    </main>
    <script src="workspace.js" defer></script>
  </body>
</html>
