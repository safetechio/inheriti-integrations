<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Blocked by InheritiGuard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="shield" aria-hidden="true"><svg viewBox="0 0 26 32"><path id="shield-path" /></svg></div>
      <p class="brand">InheritiGuard</p>
      <h1>This page was blocked</h1>
      <p class="explanation">Browser Protection stopped navigation to an untrusted destination.</p>
      <p id="blocked-location" class="location" hidden></p>
      <div class="actions"><button id="go-back" type="button">Go back</button><button id="close-tab" class="secondary" type="button">Close tab</button></div>
      <p class="footnote">Open InheritiGuard to review Browser Protection and recent activity.</p>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
